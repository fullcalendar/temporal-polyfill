
name: CI

on:
  push:
    branches:
      - spec-stage-4

env:
  TZ: "America/New_York"

jobs:
  ci:
    name: CI (${{ matrix.TEST_NODE_VERSION }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        TEST_NODE_VERSION: [16.20.0, 18.19.0, 20.10.0, 22.14.0, 24.16.0, 26.2.0]
        include:
          - TEST_NODE_VERSION: 16.20.0
            LINTING: 1
            SKIP_VITEST: 1
          - TEST_NODE_VERSION: 20.10.0
            MINIFIER: terser
          - TEST_NODE_VERSION: 22.14.0
            MINIFIER: swc
          - TEST_NODE_VERSION: 26.2.0
            SKIP_CORE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          # NOTE: keep synced with .npmrc
          node-version: 22.14.0
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        if: matrix.LINTING
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Minify
        if: matrix.MINIFIER
        env:
          MINIFIER: ${{ matrix.MINIFIER }}
        run: pnpm run minify

      # temporal-polyfill vitest requires temporal-utils to be built
      - name: Vitest
        if: matrix.SKIP_VITEST != 1
        run: >
          TEST_NODE_VERSION=${{ matrix.TEST_NODE_VERSION }}
          pnpm run vitest

      - name: Test 262 Full
        run: >
          TEST_NODE_VERSION=${{ matrix.TEST_NODE_VERSION }}
          TEST262_CLASS_API=full
          TEST262_MINIFIED=${{ matrix.MINIFIER }}
          pnpm run test262

      - name: Test 262 Core
        if: matrix.SKIP_CORE != 1
        run: >
          TEST_NODE_VERSION=${{ matrix.TEST_NODE_VERSION }}
          TEST262_CLASS_API=core
          TEST262_MINIFIED=${{ matrix.MINIFIER }}
          pnpm run test262
